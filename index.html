<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gordiperro Overlay - Twitch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Setup UI inicial -->
    <div id="setup-ui">
        <h2>Configuración del Overlay</h2>
        <button class="btn-twitch" onclick="login()">Conectar con Twitch</button>
        <p>Una vez conectes, copia la URL resultante y pégala en OBS.</p>
        <p class="info">Presiona Shift+C para mostrar/ocultar el panel de configuración</p>
    </div>

    <!-- UI de configuración (oculta por defecto) -->
    <div id="config-ui"></div>

    <!-- Laterales para distribución de cartas -->
    <div id="left-side"></div>
    <div id="right-side"></div>

    <!-- Contenedor de alerta central -->
    <div id="alert-container">
        <div id="central-alert">
            <div id="central-image"></div>
            <div id="alert-text"></div>
            <div id="multiplier"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/sound-manager.js"></script>
    <script src="js/card-distributor.js"></script>
    <script src="js/animation-controller.js"></script>
    <script src="js/twitch-connection.js"></script>
    <script src="js/alert-manager.js"></script>
    
    <script>
        // Inicializar UI de configuración inmediatamente (antes de conectar con Twitch)
        configUI.init();
        
        // 1. DETECTAR TOKEN EN URL
        const params = new URLSearchParams(window.location.hash.replace('#', '?'));
        const token = params.get('access_token');

        if (token) {
            document.getElementById('setup-ui').style.display = 'none';
            iniciarSistema();
        }

        function login() {
            const scope = 'channel:read:redemptions';
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scope)}`;
            window.location.href = authUrl;
        }

        // 2. INICIAR SISTEMA COMPLETO
        async function iniciarSistema() {
            console.log('Iniciando sistema Gordiperro Overlay...');
            
            // Inicializar alert manager (inicializa todos los módulos)
            await alertManager.init();
            
            // Inicializar conexión con Twitch
            twitchConnection.init(token);
            
            // Configurar callback para cuando se canjee la recompensa específica
            twitchConnection.onReward((data) => {
                alertManager.handleRewardRedemption(data);
            });
            
            console.log('Sistema iniciado correctamente');
        }
    </script>
</body>
</html>
